version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worldcup_predictions_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=worldcup_secret_key_2026_docker_container_platform
    volumes:
      # Persists filesystem JSON db file across restarts
      - app_data:/app

volumes:
  app_data:
